services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfoliorank
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  maildev:
    image: maildev/maildev:2.1.0
    restart: unless-stopped
    ports:
      - "1080:1080"
      - "1025:1025"
volumes:
  pgdata:
